<!DOCTYPE html>
<html class="scroll-smooth" lang="tr">
  <head>
    <!-- Google tag (gtag.js) + Consent Mode v2 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // KVKK: ziyaretçi çerez panelinden izin verene kadar Google'a hiçbir veri gitmez.
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied'
  });

  (function () {
    var GA_ID = 'G-71YPDP9N7T';
    var CONSENT_KEY = 'cookie_consent';
    var CONSENT_VERSION = 1;
    var CONSENT_MAX_AGE = 365 * 24 * 60 * 60 * 1000; // 12 ay sonra tercih yeniden sorulur
    // Ölçüm yalnız asıl alan adında: Netlify önizleme adresleri ve localhost sayılmaz
    var MEASURE = /(^|\.)emirotomatcnc\.com$/.test(location.hostname);
    var loaded = false;

    // Çerez bandı ve tercih paneli bu fonksiyonu çağırır
    window.applyCookieConsent = function (c) {
      gtag('consent', 'update', {
        analytics_storage: c.analytics ? 'granted' : 'denied',
        ad_storage: c.ads ? 'granted' : 'denied',
        ad_user_data: c.ads ? 'granted' : 'denied',
        ad_personalization: c.ads ? 'granted' : 'denied'
      });
      if (!MEASURE || loaded || !(c.analytics || c.ads)) return;
      loaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', GA_ID);
    };

    try {
      var saved = JSON.parse(localStorage.getItem(CONSENT_KEY));
      if (saved && saved.version === CONSENT_VERSION && Date.now() - saved.date < CONSENT_MAX_AGE) {
        window.applyCookieConsent(saved);
      }
    } catch (e) {}

    // Olay gönderimi: yalnız izin verilip ölçüm açıldıysa
    window.gaEvent = function (name, params) {
      if (loaded) gtag('event', name, params);
    };

    // Telefon / WhatsApp / e-posta tıklamaları
    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('a[href]');
      if (!link) return;
      var href = link.getAttribute('href');
      var name = /^tel:/i.test(href) ? 'phone_click'
        : /wa\.me|whatsapp\.com/i.test(href) ? 'whatsapp_click'
        : /^mailto:/i.test(href) ? 'email_click'
        : null;
      if (name) window.gaEvent(name, { link_url: href });
    }, true);
  })();
</script>

    <link rel="icon" href="/favicon.png" />
